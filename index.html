<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PGI - Gestão de Cotações & Suprimentos</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #00205B; /* Azul oficial da A.Yoshii para evitar tela branca no carregamento */
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <!-- Iframe em tela cheia apontando para a URL segura e otimizada do Streamlit -->
    <iframe 
        src="https://gestaocomprasay.streamlit.app/?embed=true" 
        allow="clipboard-write; gamepad; geolocation; gyroscope; microphone; camera; midi; vr; encrypted-media; autoplay"
        sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-downloads">
    </iframe>
</body>
</html>
